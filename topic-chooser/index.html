<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Topic Roulette</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: one centered game-show column — category chips, a slot-reel window, one big spin button, history below. */
:root {
  --bg: #eef1f8; --surface: #ffffff; --ink: #141a33; --muted: #5b6386;
  --line: #d5dbec; --accent: #ff5a1f; --accent-ink: #ffffff; --reel: #1d2550; --reel-ink: #ffffff; --glow: rgba(255,90,31,.35);
  --display: "Bricolage Grotesque", "Arial Black", system-ui, sans-serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1226; --surface: #181d3a; --ink: #eef0fa; --muted: #9aa2c7;
  --line: #2a3160; --accent: #ff6d36; --accent-ink: #160a04; --reel: #070915; --reel-ink: #ffffff; --glow: rgba(255,109,54,.4); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1226; --surface: #181d3a; --ink: #eef0fa; --muted: #9aa2c7;
  --line: #2a3160; --accent: #ff6d36; --accent-ink: #160a04; --reel: #070915; --reel-ink: #ffffff; --glow: rgba(255,109,54,.4); color-scheme: dark }

[hidden] { display: none !important; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; }
.wrap { max-width: 560px; margin: 0 auto; padding-block: 28px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 22px; }
header h1 { font-family: var(--display); font-weight: 800; font-size: clamp(2rem, 8vw, 2.8rem); line-height: 1; margin: 0; letter-spacing: -.02em; text-wrap: balance; }
header p { margin: 8px 0 0; color: var(--muted); }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font: 600 .9rem var(--body); border: 1.5px solid var(--line); background: var(--surface); color: var(--ink);
  padding: 8px 14px; border-radius: 999px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip:focus-visible, button:focus-visible, textarea:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.reel { --row: 84px; position: relative; height: calc(var(--row) * 3); background: var(--reel); color: var(--reel-ink);
  border-radius: 22px; overflow: hidden; box-shadow: inset 0 0 0 4px rgba(255,255,255,.06); }
.reel::before, .reel::after { content: ""; position: absolute; left: 0; right: 0; height: var(--row); z-index: 2; pointer-events: none; }
.reel::before { top: 0; background: linear-gradient(var(--reel), transparent); }
.reel::after { bottom: 0; background: linear-gradient(transparent, var(--reel)); }
.window { position: absolute; left: 10px; right: 10px; top: var(--row); height: var(--row); border-radius: 14px;
  border: 3px solid var(--accent); z-index: 3; pointer-events: none; transition: box-shadow .3s; }
.reel.landed .window { box-shadow: 0 0 0 6px var(--glow), 0 0 40px var(--glow); }
.strip { position: absolute; left: 0; right: 0; top: 0; will-change: transform; }
.item { height: var(--row); display: flex; align-items: center; justify-content: center; text-align: center;
  padding: 0 28px; font-family: var(--display); font-weight: 500; font-size: clamp(1.05rem, 4.4vw, 1.35rem); line-height: 1.15; text-wrap: balance; }
.item.win { font-weight: 800; }
.pointer { position: absolute; top: 50%; width: 0; height: 0; z-index: 4; transform: translateY(-50%); border: 10px solid transparent; }
.pointer.l { left: 0; border-left-color: var(--accent); }
.pointer.r { right: 0; border-right-color: var(--accent); }

.result { min-height: 3.2em; text-align: center; }
.result .label { font: 600 .75rem var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.result .topic { font-family: var(--display); font-weight: 800; font-size: clamp(1.4rem, 6vw, 1.9rem); line-height: 1.15; margin-top: 4px; text-wrap: balance; }

.controls { display: flex; gap: 10px; align-items: center; }
.spin { flex: 1; font: 800 1.35rem var(--display); letter-spacing: .02em; background: var(--accent); color: var(--accent-ink);
  border: 0; border-radius: 16px; padding: 18px; cursor: pointer; box-shadow: 0 6px 0 color-mix(in srgb, var(--accent) 60%, #000); transition: transform .08s, box-shadow .08s; }
.spin:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 2px 0 color-mix(in srgb, var(--accent) 60%, #000); }
.spin:disabled { opacity: .7; cursor: default; }
.icon-btn { font: 600 .9rem var(--body); background: var(--surface); color: var(--ink); border: 1.5px solid var(--line); border-radius: 14px; padding: 0 14px; height: 58px; cursor: pointer; }
.icon-btn[aria-pressed="false"] { color: var(--muted); }

.options { display: flex; flex-wrap: wrap; gap: 16px; color: var(--muted); font-size: .92rem; }
.options label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.options input { accent-color: var(--accent); width: 18px; height: 18px; }

.panel { background: var(--surface); border: 1.5px solid var(--line); border-radius: 18px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
.panel h2 { font: 800 1.05rem var(--display); margin: 0; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.panel h2 small { font: 500 .8rem var(--body); color: var(--muted); }
textarea { width: 100%; box-sizing: border-box; min-height: 160px; resize: vertical; font: 1rem/1.5 var(--body); color: var(--ink);
  background: var(--bg); border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.history { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; counter-reset: h; }
.history li { display: flex; gap: 10px; align-items: baseline; font-size: .95rem; }
.history li span { font: 600 .75rem var(--body); color: var(--muted); min-width: 4.5em; font-variant-numeric: tabular-nums; }
.history .empty { color: var(--muted); }
.link { background: none; border: 0; color: var(--muted); font: 500 .8rem var(--body); text-decoration: underline; cursor: pointer; padding: 0; }
.pool-note { font-size: .85rem; color: var(--muted); }

@media (prefers-reduced-motion: reduce) { .spin, .window { transition: none; } }
</style>

<div class="wrap">
  <header>
    <h1>Topic Roulette</h1>
    <p>Pick a deck, hit spin, and talk about whatever it lands on.</p>
  </header>

  <div class="chips" id="chips" role="group" aria-label="Topic deck"></div>

  <div class="reel" id="reel" aria-hidden="true">
    <div class="strip" id="strip"></div>
    <div class="window"></div>
    <div class="pointer l"></div><div class="pointer r"></div>
  </div>

  <div class="result" aria-live="polite">
    <div class="label" id="resultLabel">Ready</div>
    <div class="topic" id="resultTopic">Tap spin to pick a topic</div>
  </div>

  <div class="controls">
    <button class="spin" id="spin" type="button">SPIN</button>
    <button class="icon-btn" id="sound" type="button" aria-pressed="true" title="Toggle sound">Sound on</button>
  </div>

  <div class="options">
    <label><input type="checkbox" id="noRepeat" checked> Don't repeat until the deck runs out</label>
    <span class="pool-note" id="poolNote"></span>
  </div>

  <section class="panel" id="customPanel" hidden>
    <h2>Your topics <small>one per line</small></h2>
    <textarea id="custom" aria-label="Custom topics, one per line"></textarea>
  </section>

  <section class="panel">
    <h2>Picked so far <button class="link" id="clear" type="button">Clear</button></h2>
    <ol class="history" id="history"><li class="empty">Nothing yet.</li></ol>
  </section>
</div>

<script>
const DECKS = {
  "Random": null,
  "Chill": [
    "Best meal you've ever had", "Your perfect lazy Sunday", "A show you'd rewatch forever", "Dream vacation spot",
    "Most useless talent you have", "Your comfort food", "Favorite childhood cartoon", "Song stuck in your head lately",
    "Best gift you ever got", "Weirdest food combo you love", "Your go-to karaoke song", "Coffee, tea, or neither?",
    "A place that feels like home", "Best concert you've been to", "Your ideal pet", "Favorite season and why"
  ],
  "Deep": [
    "What would you do if money didn't matter?", "A belief you changed your mind on", "What makes a good friend?",
    "Advice you'd give your 12-year-old self", "What are you most grateful for right now?", "Your biggest fear",
    "A moment that changed your life", "What does success mean to you?", "Something you wish people asked you about",
    "What would your perfect day look like in 10 years?", "Who shaped you the most?", "A risk you're glad you took",
    "What do you want to be remembered for?", "Something you're still learning to accept"
  ],
  "Funny": [
    "Most embarrassing thing that happened at school", "Worst haircut you've ever had", "Weirdest dream you remember",
    "If animals could talk, which would be the rudest?", "Your most chaotic cooking fail", "Strangest thing you believed as a kid",
    "The pettiest thing you've ever done", "Worst date story (yours or a friend's)", "Your villain origin story",
    "A dumb argument you refuse to lose", "If you were a kitchen appliance, which one?", "Funniest autocorrect fail",
    "The most cursed snack combo", "Pitch a terrible startup idea"
  ],
  "Would you rather": [
    "Would you rather fly or be invisible?", "Would you rather live in the past or the future?", "Would you rather never use social media or never watch TV again?",
    "Would you rather be famous or rich?", "Would you rather talk to animals or speak every language?", "Would you rather always be 10 minutes late or 20 minutes early?",
    "Would you rather lose your phone or your wallet?", "Would you rather live by the beach or in the mountains?", "Would you rather have no music or no movies?",
    "Would you rather read minds or see the future?", "Would you rather be a kid again or skip to retirement?", "Would you rather eat only pizza or only tacos forever?"
  ],
  "Debate": [
    "Is a hot dog a sandwich?", "Cats vs dogs", "Is cereal a soup?", "Pineapple on pizza: yes or no?",
    "Should homework be banned?", "Morning person vs night owl", "Books vs movies", "Is water wet?",
    "Best decade for music", "Phones at the dinner table: okay or rude?", "Does the toilet paper go over or under?",
    "Is it better to text or call?", "Should tipping be replaced by higher wages?", "Summer vs winter"
  ],
  "Story": [
    "You wake up with a new superpower. What happens?", "Tell a story that starts with \"I wasn't supposed to open that door...\"",
    "Describe the worst day at a theme park", "You find a note in your pocket you didn't write", "Your phone starts giving you advice",
    "Invent a holiday and explain how people celebrate it", "You're stuck in an elevator with a celebrity", "You get a text from your future self",
    "Narrate your morning like a nature documentary", "You switch lives with your pet for a day", "A mysterious package arrives at your door",
    "Make up a legend about your hometown"
  ],
  "Custom": []
};
const CUSTOM_DEFAULT = ["Favorite movie", "Hidden talent", "Best trip ever", "Hot take", "Something that made you laugh this week"];

const $ = (id) => document.getElementById(id);
const strip = $("strip"), reel = $("reel"), spinBtn = $("spin");
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};

let deck = store.get("tr.deck", "Random");
if (!(deck in DECKS)) deck = "Random";
let soundOn = store.get("tr.sound", true);
let used = {};            // deck -> Set of used topics
let history = [];
let spinning = false;

$("custom").value = store.get("tr.custom", CUSTOM_DEFAULT.join("\n"));
$("custom").addEventListener("input", () => { store.set("tr.custom", $("custom").value); used.Custom = new Set(); updateNote(); });

function topics(name = deck) {
  if (name === "Custom") return $("custom").value.split("\n").map(s => s.trim()).filter(Boolean);
  if (name === "Random") return Object.keys(DECKS).filter(k => DECKS[k] && DECKS[k].length).flatMap(k => DECKS[k]);
  return DECKS[name];
}

function renderChips() {
  const box = $("chips"); box.innerHTML = "";
  for (const name of Object.keys(DECKS)) {
    const b = document.createElement("button");
    b.type = "button"; b.className = "chip"; b.textContent = name;
    b.setAttribute("aria-pressed", String(name === deck));
    b.addEventListener("click", () => { if (spinning) return; deck = name; store.set("tr.deck", deck); renderChips(); idleStrip(); });
    box.appendChild(b);
  }
  $("customPanel").hidden = deck !== "Custom";
  updateNote();
}

function updateNote() {
  const list = topics(), u = used[deck];
  const left = list.length - (u ? [...u].filter(t => list.includes(t)).length : 0);
  $("poolNote").textContent = $("noRepeat").checked ? `${left} of ${list.length} left` : `${list.length} topics`;
}

const rand = (a) => a[Math.floor(Math.random() * a.length)];

function rowH() { return parseFloat(getComputedStyle(reel).getPropertyValue("--row")) || 84; }

function fillStrip(items, winIndex) {
  strip.innerHTML = "";
  items.forEach((t, i) => {
    const d = document.createElement("div");
    d.className = "item" + (i === winIndex ? " win" : "");
    d.textContent = t; strip.appendChild(d);
  });
}

function idleStrip() {
  const list = topics();
  reel.classList.remove("landed");
  if (!list.length) { fillStrip(["", "Add some topics below", ""]); strip.style.transform = "translateY(0)"; return; }
  fillStrip([rand(list), rand(list), rand(list)]);
  strip.style.transform = "translateY(0)";
}

// --- sound ---
let actx = null;
function tick(freq = 900, dur = 0.03, vol = 0.08) {
  if (!soundOn) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = "square"; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
    o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime + dur);
  } catch {}
}
function ding() { [660, 880, 1320].forEach((f, i) => setTimeout(() => tick(f, 0.18, 0.1), i * 90)); }

function pickWinner(list) {
  if (!$("noRepeat").checked) return rand(list);
  const u = used[deck] = used[deck] || new Set();
  let pool = list.filter(t => !u.has(t));
  if (!pool.length) { u.clear(); pool = list.slice(); }
  const w = rand(pool); u.add(w); return w;
}

function spin() {
  if (spinning) return;
  const list = topics();
  if (!list.length) { $("resultLabel").textContent = "No topics"; $("resultTopic").textContent = "Add at least one topic to your list"; return; }
  spinning = true; spinBtn.disabled = true; reel.classList.remove("landed");
  $("resultLabel").textContent = "Spinning…"; $("resultTopic").textContent = " ";

  const winner = pickWinner(list);
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const N = reduce ? 6 : 34 + Math.floor(Math.random() * 8);
  const items = [];
  for (let i = 0; i < N; i++) items.push(rand(list));
  const winIndex = N - 2;               // the row that ends in the middle window
  items[winIndex] = winner;
  fillStrip(items, winIndex);

  const h = rowH();
  const end = (winIndex - 1) * h;       // window is the 2nd visible row
  const dur = reduce ? 400 : 3600 + Math.random() * 900;
  const ease = (t) => 1 - Math.pow(1 - t, 4);
  let start = null, lastRow = -1;

  function frame(now) {
    if (start === null) start = now;
    const t = Math.min(1, (now - start) / dur);
    const y = end * ease(t);
    strip.style.transform = `translateY(${-y}px)`;
    const row = Math.floor(y / h + 0.5);
    if (row !== lastRow) { lastRow = row; tick(700 + Math.random() * 300); }
    if (t < 1) requestAnimationFrame(frame); else land(winner);
  }
  requestAnimationFrame(frame);
}

function land(winner) {
  spinning = false; spinBtn.disabled = false;
  reel.classList.add("landed"); ding();
  if (navigator.vibrate) { try { navigator.vibrate(40); } catch {} }
  $("resultLabel").textContent = deck === "Random" ? "Your topic" : `${deck} topic`;
  $("resultTopic").textContent = winner;
  history.unshift({ topic: winner, deck, at: new Date() });
  history = history.slice(0, 12);
  renderHistory(); updateNote();
}

function renderHistory() {
  const ol = $("history"); ol.innerHTML = "";
  if (!history.length) { ol.innerHTML = '<li class="empty">Nothing yet.</li>'; return; }
  for (const h of history) {
    const li = document.createElement("li");
    const s = document.createElement("span");
    s.textContent = h.at.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    li.append(s, document.createTextNode(h.topic));
    ol.appendChild(li);
  }
}

spinBtn.addEventListener("click", spin);
document.addEventListener("keydown", (e) => {
  if ((e.code === "Space" || e.code === "Enter") && !["TEXTAREA", "INPUT", "BUTTON"].includes(document.activeElement.tagName)) { e.preventDefault(); spin(); }
});
$("sound").addEventListener("click", () => {
  soundOn = !soundOn; store.set("tr.sound", soundOn);
  $("sound").setAttribute("aria-pressed", String(soundOn)); $("sound").textContent = soundOn ? "Sound on" : "Sound off";
});
$("sound").setAttribute("aria-pressed", String(soundOn)); $("sound").textContent = soundOn ? "Sound on" : "Sound off";
$("noRepeat").addEventListener("change", updateNote);
$("clear").addEventListener("click", () => { history = []; used = {}; renderHistory(); updateNote(); });

renderChips(); idleStrip();
</script>
</body>
</html>
